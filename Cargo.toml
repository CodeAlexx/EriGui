[workspace]
resolver = "2"
members = [
    "erigui-core",
    "erigui-widgets",
    "erigui-rendering",
    "erigui-examples",
    "erigui-nodes",
    "erigui-workflow",
    "erigui-runtime",
    "erigui-app",
]

[workspace.package]
version = "0.0.3-alpha"
edition = "2021"
authors = ["EriGui Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CodeAlexx/EriGui"

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Graphics dependencies (Wayland-only; avoid pulling X11 back in)
gl = "0.14"
glutin = { version = "0.31", default-features = false, features = ["egl", "wayland", "x11", "glx"] }
glutin-winit = { version = "0.4", default-features = false, features = ["egl", "wayland", "x11"] }
winit = { version = "0.29", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "rwh_05"] }
raw-window-handle = "0.5"

# Font rendering - use freetype for proper font rendering
freetype-rs = "0.38"

# Math and utilities
glam = "0.29"
smallvec = "1.13"
slotmap = "1.0"

# Event handling
bitflags = "2.6"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
