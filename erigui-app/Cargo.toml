[package]
name = "erigui-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Wave-3 top-level binary that wires the NodeGraph widget (erigui-widgets),
# the runtime executor (erigui-runtime), the workflow JSON envelope
# (erigui-workflow), the Klein starter nodes (erigui-nodes), and the GL
# renderer (erigui-rendering) into a single runnable program.
#
# Pure Rust. No Python, no inference-flame import here — the runtime crate
# already drags in the GPU stack transitively through erigui-nodes.

[dependencies]
erigui-core = { path = "../erigui-core" }
erigui-rendering = { path = "../erigui-rendering" }
erigui-widgets = { path = "../erigui-widgets" }
erigui-nodes = { path = "../erigui-nodes" }
erigui-runtime = { path = "../erigui-runtime" }
erigui-workflow = { path = "../erigui-workflow" }

# C2/C3 progress events carry `flame_core::Tensor` for the inline node
# preview path. The app does the tensor → RGB byte conversion locally so
# erigui-widgets doesn't need to depend on flame-core / cuDNN.
flame-core = { path = "../../../EriDiffusion/flame-core", default-features = false, features = ["cuda", "bf16_u16", "cudnn", "shared_storage"] }

winit = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }

serde_json = "1"

[[bin]]
name = "erigui-app"
path = "src/main.rs"
